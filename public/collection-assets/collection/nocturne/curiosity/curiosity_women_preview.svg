<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <radialGradient id="navyGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2c3f"/>
      <stop offset="60%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#090d14"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8aa76" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8a7046" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c8aa76" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="suedeGradiant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24344d"/>
      <stop offset="100%" stop-color="#141d2c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#navyGlow)"/>

  <!-- Luxury Outer Double Inset Border -->
  <rect x="36" y="36" width="828" height="1128" fill="none" stroke="url(#goldBorder)" stroke-width="1" opacity="0.75"/>
  <rect x="44" y="44" width="812" height="1112" fill="none" stroke="#c8aa76" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Corner Flourishes -->
  <path d="M30 50 L50 30 M870 50 L850 30 M30 1150 L50 1170 M870 1150 L850 1170" stroke="#c8aa76" stroke-width="1" opacity="0.5"/>

  <!-- Top Brand / Eyebrow Header -->
  <g transform="translate(450, 120)" text-anchor="middle">
    <text font-family="'Cinzel', 'Garamond', 'Didot', serif" font-size="16" letter-spacing="8" fill="#c8aa76" opacity="0.9">EKKOMI · NOCTURNE</text>
    <line x1="-120" y1="24" x2="120" y2="24" stroke="#c8aa76" stroke-width="0.75" opacity="0.4"/>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" letter-spacing="5" fill="#8c9bb0" text-transform="uppercase">Women's Collection · 01</text>
  </g>

  <!-- Central Silhouette Graphic: Dark Navy Women's Jacket -->
  <g transform="translate(450, 520)">
    <!-- Aura behind jacket -->
    <ellipse cx="0" cy="0" rx="220" ry="260" fill="#22354e" opacity="0.3" filter="blur(30px)"/>

    <!-- Tailored Jacket Outline -->
    <!-- Collar & Lapel -->
    <path d="M-150 -160 C-90 -190 90 -190 150 -160 L180 -30 C190 60 170 160 145 230 L-145 230 C-170 160 -190 60 -180 -30 Z" 
          fill="url(#suedeGradiant)" stroke="#3a4f6d" stroke-width="2"/>
    
    <!-- Yoke & Sleeves -->
    <path d="M-150 -160 L-220 -70 L-205 160 L-155 140 L-160 -10 L-130 180 L130 180 L160 -10 L155 140 L205 160 L220 -70 L150 -160" 
          fill="#1b2638" stroke="#3a4f6d" stroke-width="1.5"/>

    <!-- Symmetrical Lapel and Placket Details -->
    <path d="M-55 -175 L0 -70 L55 -175" fill="none" stroke="#c8aa76" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="-70" x2="0" y2="228" stroke="#3a4f6d" stroke-width="2"/>
    <line x1="0" y1="-70" x2="0" y2="228" stroke="#c8aa76" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6"/>

    <!-- Tonal Floral Embroidery Contours on Chest -->
    <g stroke="#c8aa76" stroke-width="1" fill="none" opacity="0.65">
      <!-- Left Motif -->
      <path d="M-80 -40 C-95 -60 -120 -50 -115 -30 C-110 -10 -85 -15 -80 -40 Z"/>
      <path d="M-90 -20 C-110 -10 -120 15 -100 25 C-80 35 -75 5 -90 -20 Z"/>
      <circle cx="-95" cy="-25" r="4" fill="#c8aa76" opacity="0.5"/>
      <path d="M-75 -5 C-60 15 -70 45 -90 55" stroke-dasharray="2 3"/>

      <!-- Right Motif -->
      <path d="M80 -40 C95 -60 120 -50 115 -30 C110 -10 85 -15 80 -40 Z"/>
      <path d="M90 -20 C110 -10 120 15 100 25 C80 35 75 5 90 -20 Z"/>
      <circle cx="95" cy="-25" r="4" fill="#c8aa76" opacity="0.5"/>
      <path d="M75 -5 C60 15 70 45 90 55" stroke-dasharray="2 3"/>
    </g>

    <!-- Cinched Waistlines -->
    <path d="M-135 75 Q0 95 135 75" fill="none" stroke="#3a4f6d" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Status Emblem in center of jacket -->
    <circle cx="0" cy="25" r="32" fill="#0d141e" stroke="#c8aa76" stroke-width="1" opacity="0.9"/>
    <circle cx="0" cy="25" r="3" fill="#c8aa76"/>
    <circle cx="0" cy="25" r="16" fill="none" stroke="#c8aa76" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>
  </g>

  <!-- Title & Narrative Block -->
  <g transform="translate(450, 930)" text-anchor="middle">
    <text font-family="'Cinzel', 'Garamond', 'Didot', serif" font-size="44" letter-spacing="10" fill="#f4ece1" font-weight="400">CURIOSITY</text>
    <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="6" fill="#c8aa76" text-transform="uppercase">Dark Navy · Women's Tailored Cut</text>
    <line x1="-80" y1="62" x2="80" y2="62" stroke="#c8aa76" stroke-width="1" opacity="0.4"/>
    <text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" fill="#8c9bb0" text-transform="uppercase">Photography In Production</text>
    <text y="116" font-family="'Garamond', Georgia, serif" font-style="italic" font-size="14" fill="#6d7d93">Campaign editorial scheduled · Craft specifications available below</text>
  </g>

  <!-- Bottom Brand Mark -->
  <g transform="translate(450, 1140)" text-anchor="middle">
    <circle cx="0" cy="-15" r="2" fill="#c8aa76" opacity="0.6"/>
  </g>
</svg>